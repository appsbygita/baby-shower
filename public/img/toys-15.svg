<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
        <rect width="200" height="200" fill="#FDF6EC"/>
        <g opacity="0.15">
          <!-- Wooden Rocking Horse (Top Left) -->
          <g transform="translate(15,15)">
            <!-- Curved Base Rocker -->
            <path d="M 5,45 Q 25,55 45,45" stroke="#D98A6C" stroke-width="3" fill="none" stroke-linecap="round"/>
            <!-- Horse Body & Head -->
            <path d="M 15,35 Q 20,25 30,28 L 36,15 Q 32,12 28,16 L 25,18 L 22,12 L 32,8 Q 42,10 40,22 L 35,30 Q 38,36 32,38 Z" fill="#D98A6C"/>
            <!-- Legs -->
            <line x1="18" y1="35" x2="12" y2="47" stroke="#C27457" stroke-width="2.5"/>
            <line x1="32" y1="35" x2="38" y2="47" stroke="#C27457" stroke-width="2.5"/>
            <!-- Eye -->
            <circle cx="28" cy="13" r="1" fill="#FFFFFF"/>
          </g>

          <!-- Wooden Building Blocks A B C (Top Right) -->
          <g transform="translate(130,20)">
            <!-- Cube 1 -->
            <rect x="0" y="15" width="22" height="22" rx="3" fill="#F4A261"/>
            <text x="6" y="31" font-family="sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">A</text>
            <!-- Cube 2 -->
            <rect x="20" y="2" width="20" height="20" rx="3" fill="#4A5D4E"/>
            <text x="26" y="17" font-family="sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">B</text>
          </g>

          <!-- Teddy Bear (Center Right) -->
          <g transform="translate(125,105)">
            <!-- Ears -->
            <circle cx="8" cy="8" r="5" fill="#D98A6C"/>
            <circle cx="28" cy="8" r="5" fill="#D98A6C"/>
            <!-- Head -->
            <circle cx="18" cy="16" r="12" fill="#EABBA8"/>
            <!-- Snout -->
            <ellipse cx="18" cy="18" rx="5" ry="4" fill="#FCECDD"/>
            <circle cx="18" cy="16" r="1.5" fill="#333333"/>
            <!-- Eyes -->
            <circle cx="13" cy="13" r="1.2" fill="#333333"/>
            <circle cx="23" cy="13" r="1.2" fill="#333333"/>
            <!-- Body -->
            <ellipse cx="18" cy="34" rx="11" ry="12" fill="#D98A6C"/>
            <ellipse cx="18" cy="34" rx="6" ry="7" fill="#FCECDD"/>
          </g>

          <!-- Baby Rattle (Bottom Left) -->
          <g transform="translate(20,120) rotate(-25)">
            <circle cx="15" cy="15" r="12" fill="#F4A261"/>
            <circle cx="15" cy="15" r="7" fill="#FCECDD"/>
            <rect x="13" y="27" width="4" height="20" rx="2" fill="#4A5D4E"/>
            <circle cx="15" cy="50" r="4" fill="#D98A6C"/>
          </g>

          <!-- Wooden Toy Train (Bottom Center) -->
          <g transform="translate(70,150)">
            <!-- Engine Body -->
            <rect x="10" y="10" width="35" height="18" rx="2" fill="#4A5D4E"/>
            <rect x="30" y="2" width="12" height="26" rx="2" fill="#D98A6C"/>
            <!-- Chimney -->
            <rect x="14" y="4" width="5" height="6" fill="#F4A261"/>
            <!-- Wheels -->
            <circle cx="18" cy="30" r="5" fill="#333333"/>
            <circle cx="18" cy="30" r="2" fill="#FFFFFF"/>
            <circle cx="36" cy="30" r="5" fill="#333333"/>
            <circle cx="36" cy="30" r="2" fill="#FFFFFF"/>
          </g>

          <!-- Little Wooden Ring Stacker / Accessories -->
          <g transform="translate(85,25)">
            <rect x="8" y="0" width="18" height="5" rx="2" fill="#D98A6C"/>
            <rect x="5" y="6" width="24" height="5" rx="2" fill="#F4A261"/>
            <rect x="2" y="12" width="30" height="5" rx="2" fill="#4A5D4E"/>
          </g>

          <!-- Floating Decorative Dots -->
          <circle cx="75" cy="90" r="3" fill="#EABBA8"/>
          <circle cx="10" cy="80" r="2" fill="#4A5D4E"/>
          <circle cx="185" cy="85" r="2.5" fill="#F4A261"/>
        </g>
      </svg>